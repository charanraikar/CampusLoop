<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusLoop · Campus life, made easy</title>
    <meta name="theme-color" content="#476c54" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="loader" class="on boot" role="status" aria-live="polite">
      <div class="loader-bar"></div>
      <div class="loader-card">
        <div class="orbit">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="42" />
            <circle class="arc" cx="50" cy="50" r="42" /></svg
          ><span class="loader-logo">↗</span>
        </div>
        <p class="loader-text" data-i18n>Loading CampusLoop…</p>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <header>
      <a class="brand" href="#home"
        ><span class="logo">↗</span>Campus<span>Loop</span></a
      >
      <nav aria-label="Main navigation">
        <a href="#home" data-i18n>Discover</a
        ><a href="#groups" data-i18n>Group orders</a
        ><a href="#orders" data-i18n>Dashboard</a>
      </nav>
      <div id="account"></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer>
      <strong>CampusLoop</strong><span data-i18n>Campus life, made easy.</span>
      <nav class="legal-links" aria-label="Legal">
        <a href="/terms" data-i18n>Terms</a
        ><a href="/privacy" data-i18n>Privacy</a
        ><a href="/refund-policy" data-i18n>Refunds</a>
      </nav>
    </footer>
    <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
